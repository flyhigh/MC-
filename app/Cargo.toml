[workspace]
resolver = "3"
members = [
    "crates/mcwp-platform",
    "crates/mcwp-render",
    "crates/mcwp-ai",
    "crates/mcwp-spec",
    "crates/mcwp-ui",
    "crates/mcwp-wallpaper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 只要 DX12 + WGSL:后端在 `mcwp-render` 里是写死的 `Backends::DX12`,着色器是 WGSL。
# wgpu 默认还开着 vulkan / gles / metal / webgpu —— vulkan 那条会把 `ash`(Vulkan 绑定,
# release rlib 就 68 MB)整个拖进依赖树,webgpu 还会给 naga 加一个用不到的 WGSL 输出后端。
# 关掉之后依赖树和成品都明显变小,编译也快。
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12", "wgsl", "parking_lot"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

